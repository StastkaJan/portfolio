x-portfolio: &portfolio
  build: .
  image: ${PORTFOLIO_IMAGE:-portfolio:latest}
  expose:
    - "3000"
  env_file:
    - .env
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    ORIGIN: ${ORIGIN:-https://stastka.dev}
  volumes:
    - ./content:/app/content
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 2s
    timeout: 2s
    retries: 30
  restart: unless-stopped

services:
  portfolio-blue:
    <<: *portfolio

  portfolio-green:
    <<: *portfolio

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./preview-routes:/etc/caddy/preview-routes:ro
      - caddy_data:/data
    dns:
      - 8.8.8.8
    networks:
      - default
      - public-web
    restart: unless-stopped

networks:
  public-web:
    name: public-web
    external: true

volumes:
  caddy_data:
