x-portfolio: &portfolio
  build: .
  image: ${PORTFOLIO_IMAGE:-portfolio:latest}
  expose:
    - "3000"
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
    interval: 2s
    timeout: 2s
    retries: 30
  restart: unless-stopped

services:
  portfolio-blue:
    <<: *portfolio

  portfolio-green:
    <<: *portfolio

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./preview-routes:/etc/caddy/preview-routes:ro
      - caddy_data:/data
    dns:
      - 8.8.8.8
    networks:
      - default
      - public-web
    restart: unless-stopped

networks:
  public-web:
    name: public-web
    external: true

volumes:
  caddy_data:
