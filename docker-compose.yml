services:
  portfolio:
    build: .
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ORIGIN
    volumes:
      - ./content:/app/content
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    dns:
      - 8.8.8.8
    depends_on:
      - portfolio
    restart: unless-stopped

volumes:
  caddy_data:
