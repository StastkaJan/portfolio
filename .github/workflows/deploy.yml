name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ~/portfolio
            rollback_config=../portfolio-caddy-rollback
            cp Caddyfile "$rollback_config"
            deployment_succeeded=false

            rollback() {
              if [ "$deployment_succeeded" != true ]; then
                cp "$rollback_config" Caddyfile
                rm -f Caddyfile.next
                if [ -n "${candidate_service:-}" ]; then
                  docker compose ps "$candidate_service" || true
                  docker compose logs --no-color --tail=100 "$candidate_service" || true
                  docker compose rm -sf "$candidate_service"
                fi
              fi
            }
            trap rollback 0

            git fetch origin main
            git reset --hard origin/main
            cp "$rollback_config" Caddyfile

            export PORTFOLIO_IMAGE=portfolio:${{ github.sha }}
            docker build -t "$PORTFOLIO_IMAGE" .
            docker network inspect public-web >/dev/null 2>&1 || docker network create public-web

            if grep -q portfolio-blue:3000 "$rollback_config"; then
              candidate=green
            else
              candidate=blue
            fi
            candidate_service="portfolio-$candidate"

            docker compose up -d --no-deps --force-recreate "$candidate_service"

            candidate_id="$(docker compose ps -q "$candidate_service")"
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$candidate_id")"
              [ "$status" = healthy ] && break
              [ "$status" = unhealthy ] && exit 1
              sleep 2
            done
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$candidate_id")" = healthy ]

            sed -e "s/portfolio-blue:3000/$candidate_service:3000/" \
                -e "s/portfolio-green:3000/$candidate_service:3000/" \
                -e "s/portfolio:3000/$candidate_service:3000/" \
                Caddyfile > Caddyfile.next
            cp Caddyfile.next Caddyfile
            rm Caddyfile.next

            docker compose up -d --no-deps caddy
            docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

            deployment_succeeded=true
            rm -f "$rollback_config"
